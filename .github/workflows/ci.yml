# Generated for the reposplit micro-repo layout.
# Steps are emitted only for tooling this repo actually contains.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install (server/frontend)
        working-directory: server/frontend
        run: npm ci
      - name: lint (server/frontend)
        working-directory: server/frontend
        run: npm run lint
      - name: typecheck (server/frontend)
        working-directory: server/frontend
        run: npm run typecheck
      - name: test (server/frontend)
        working-directory: server/frontend
        run: npm test
      - name: build (server/frontend)
        working-directory: server/frontend
        run: npm run build
  cpp-server-backend:
    name: C++ server/backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Built through the Dockerfile: configuring here directly failed on
      # find_package(Drogon) every run since the workflow was added. The
      # builder stage installs drogon and runs the unit tests (s3tests); the
      # full build also yields the image the integration script drives.
      - name: Build backend image (runs unit tests)
        working-directory: server
        run: docker build -t s3server:ci -f backend/Dockerfile .
      # Real server + postgres in throwaway containers: auth, cross-owner
      # isolation and the multipart upload contract.
      - name: Integration tests
        run: IMAGE=s3server:ci server/backend/tests/integration/run.sh
      # Handed to the SDK job so the (slow) image build happens once.
      - name: Save image for the SDK job
        run: docker save s3server:ci | gzip -1 > s3server-ci.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: s3server-image
          path: s3server-ci.tar.gz
          retention-days: 1
  # Real clients (boto3, aws-cli v2, @aws-sdk/client-s3 v3 + lib-storage,
  # rclone) from containers against the freshly built image, both directly and
  # through an nginx TLS reverse proxy. Includes a 120 MB multipart upload and
  # a 100 MB aws-cli copy, so it takes several minutes.
  sdk-clients:
    name: S3 SDK clients (SigV4)
    needs: cpp-server-backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: s3server-image
      - name: Load image
        run: gunzip -c s3server-ci.tar.gz | docker load
      - name: boto3, aws-cli, aws-sdk-js v3, rclone
        run: IMAGE=s3server:ci server/backend/tests/sdk/run.sh
