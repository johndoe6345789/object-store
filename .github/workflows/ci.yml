# Generated for the reposplit micro-repo layout.
# Steps are emitted only for tooling this repo actually contains.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install (server/frontend)
        working-directory: server/frontend
        run: npm install
      - name: lint (server/frontend)
        working-directory: server/frontend
        run: npm run lint
      - name: build (server/frontend)
        working-directory: server/frontend
        run: npm run build
  cpp-server-backend:
    name: C++ server/backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Built through the Dockerfile's builder stage, which installs drogon:
      # configuring here directly failed on find_package(Drogon) every run
      # since the workflow was added. The stage also runs the unit tests.
      - name: Build backend and run unit tests
        working-directory: server
        run: |
          docker build --target builder \
            -f backend/Dockerfile .
